name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümü
        run: flutter --version

      # Depoda yalnızca bizim yazdığımız dosyalar var. Eksik Android
      # dosyalarını (gradle, simgeler, temalar) Flutter burada üretir;
      # var olan dosyalara dokunmaz.
      - name: Eksik platform dosyalarını oluştur
        run: flutter create --platforms=android --org com.turses --project-name turses .

      - name: Android ayarları (minSdk 24, R8 kuralları)
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 24/' "$f"
          else
            sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Paketler
        run: flutter pub get

      - name: APK derle
        run: flutter build apk --release --split-per-abi

      - name: Dosyaları adlandır
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/TurSes-${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/TurSes-${{ github.run_number }}-eski-telefonlar.apk
          cp pubspec.lock out/pubspec.lock

      - uses: actions/upload-artifact@v4
        with:
          name: turses-${{ github.run_number }}
          path: out/

      - name: İndirme sayfasına koy (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deneme-${{ github.run_number }}
          name: TurSes deneme ${{ github.run_number }}
          prerelease: true
          body: |
            Telefona kurulacak dosya: TurSes-${{ github.run_number }}.apk
            (Çok eski telefonlarda açılmazsa "eski-telefonlar" olanı kurun.)
          files: |
            out/TurSes-${{ github.run_number }}.apk
            out/TurSes-${{ github.run_number }}-eski-telefonlar.apk
